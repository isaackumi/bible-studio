# Checks every push, and builds the desktop app on Windows, macOS and Linux so platform
# breakage shows up before a church installs it. Installers are attached to each run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Tests and type check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The license server and scripts (outside src/, so npm run check does not see them).
      - run: npm run check:server
      - run: npm test
      # What each window loads at start, against its budget (scripts/bundle-budget.mjs).
      - run: npm run budget

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      # Each platform compiles its own code (voice, displays), so each is linted.
      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: church-studio-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
