# Signed releases with automatic updates. Push a tag like v0.2.0 (matching the version in
# tauri.conf.json), or run this workflow from the Actions tab, and this builds Windows, macOS and
# Linux installers, signs the update files, and publishes a GitHub release with latest.json,
# which installed copies check from Settings › Updates. Tests run first; the release stays a draft
# until all three platforms are in, then becomes the latest. The release is named after the app's
# version, so bump it in package.json, tauri.conf.json and Cargo.toml before releasing again.
#
# One-time setup: add the repository secret TAURI_SIGNING_PRIVATE_KEY with the contents of
# ~/.church-studio/updater.key (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if you set a password).
# Optional: the repository variable SENTRY_DSN turns on automatic error reports.
#
# Before tagging, add the version's highlights at the top of src/lib/domain/changelog.ts: they
# become the release text and the What's new card (a test fails if the entry is missing).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Nothing ships that fails the checks CI runs.
  test:
    name: Tests before release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run check:server
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # One draft for all three platforms, made before they start. (Left to each platform job, GitHub
  # cannot find a draft by its tag, so parallel jobs each made their own and 0.3.0 split in two.)
  draft:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npx vite-node scripts/release-notes.ts > notes.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="v$version" -f target_commitish="$GITHUB_SHA" -f name="Church Studio v$version" -F draft=true -F body=@notes.md -q .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Mac builds are signed with the church's own certificate (self-signed, made once, kept in
      # ~/.church-studio): every update keeps one identity, so macOS's Screen Recording, microphone
      # and camera permissions carry over instead of being asked for again after each update. The
      # public half is .github/macos-signing.crt; trusted here for signing on this build machine only.
      - name: Trust the Mac signing certificate
        if: matrix.platform == 'macos-latest'
        run: sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain .github/macos-signing.crt
      # The release text is this version's highlights from src/lib/domain/changelog.ts.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac signing (tauri imports the certificate and signs; no Apple account, so no notarizing).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Error reports (src/lib/app/telemetry.ts): the Sentry project's DSN, a repository variable.
          # Empty: reports are off in this build.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Whisper (whisper.cpp) built for every customer's processor, not the build machine's: by
          # default it uses whatever the runner has (AVX-512 on some), which crashes on most church
          # PCs. AVX2 with FMA and F16C runs on nearly every PC from 2013 on; the app checks for it
          # before Accurate starts (whisper.rs), so an older one is told, not crashed. On Apple
          # silicon the x86 flags do nothing.
          GGML_NATIVE: "OFF"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
        with:
          # Into the one draft made above. It stays a draft until every platform is in (publish
          # below): installed copies and the download buttons read the latest release.
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":true}}

  # All three platforms built: check the release has its update file, then make it the latest.
  publish:
    needs: [draft, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="${{ needs.draft.outputs.id }}"
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q '.assets[].name')"
          echo "$assets"
          grep -qx latest.json <<< "$assets" || { echo "::error::The release has no latest.json; left as a draft."; exit 1; }
          # Every platform's update must be in latest.json, or that platform's copies never update.
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q '.assets[] | select(.name == "latest.json") | .id')" > latest.json
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p]' latest.json > /dev/null || { echo "::error::latest.json has no $platform; left as a draft."; exit 1; }
          done
          # Each file at its own version's address, not "the latest release": a copy that checked
          # before a newer release came out would otherwise ask the newer release for an older
          # file and get 404. The signatures cover the files, not the addresses.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q .tag_name)"
          jq --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" '.platforms |= map_values(.url |= sub("^https://github.com/[^/]+/[^/]+/releases/(latest/download|download/[^/]+)/"; $base))' latest.json > pinned.json
          jq -e --arg tag "$tag" '[.platforms[].url | contains("/download/" + $tag + "/")] | all' pinned.json > /dev/null || { echo "::error::latest.json addresses could not be pinned; left as a draft."; exit 1; }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q '.assets[] | select(.name == "latest.json") | .id')"
          cp pinned.json latest.json
          gh release upload "$tag" latest.json --repo "$GITHUB_REPOSITORY"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true -q .html_url
