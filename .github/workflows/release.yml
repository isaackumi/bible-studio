# Signed releases with automatic updates. Push a tag like v0.2.0 (matching the version in
# tauri.conf.json), or run this workflow from the Actions tab, and this builds Windows, macOS and
# Linux installers, signs the update files, and publishes a GitHub release with latest.json,
# which installed copies check from Settings › Updates. Tests run first; the release stays a draft
# until all three platforms are in, then becomes the latest. The release is named after the app's
# version, so bump it in package.json, tauri.conf.json and Cargo.toml before releasing again.
#
# One-time setup: add the repository secret TAURI_SIGNING_PRIVATE_KEY with the contents of
# ~/.church-studio/updater.key (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if you set a password).
# Optional: the repository variable SENTRY_DSN turns on automatic error reports.
#
# Before tagging, add the version's highlights at the top of src/lib/domain/changelog.ts: they
# become the release text and the What's new card (a test fails if the entry is missing).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Nothing ships that fails the checks CI runs.
  test:
    name: Tests before release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run check:server
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  release:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # The release text is this version's highlights from src/lib/domain/changelog.ts.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_END'
            npx vite-node scripts/release-notes.ts
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Error reports (src/lib/app/telemetry.ts): the Sentry project's DSN, a repository variable.
          # Empty: reports are off in this build.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Church Studio v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          # A draft until every platform is in (publish below): installed copies and the download
          # buttons read the latest release, so a half-built one must never be it.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":true}}

  # All three platforms built: check the release has its update file, then make it the latest.
  publish:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          assets="$(gh release view "$tag" --json assets -q '.assets[].name')"
          echo "$assets"
          grep -qx latest.json <<< "$assets" || { echo "::error::$tag has no latest.json; left as a draft."; exit 1; }
          gh release edit "$tag" --draft=false --latest
