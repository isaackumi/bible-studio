# Signed releases with automatic updates. Push a tag like v0.2.0 (matching the version in
# tauri.conf.json), or run this workflow from the Actions tab, and this builds Windows, macOS and
# Linux installers, signs the update files, and publishes a GitHub release with latest.json,
# which installed copies check from Settings › Updates. The release is named after the app's
# version, so bump it in package.json, tauri.conf.json and Cargo.toml before releasing again.
#
# One-time setup: add the repository secret TAURI_SIGNING_PRIVATE_KEY with the contents of
# ~/.church-studio/updater.key (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if you set a password).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Church Studio v__VERSION__
          releaseBody: See the changes below. Installed copies update from Settings › Updates.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":true}}
