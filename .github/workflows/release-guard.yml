# Installed copies (the updater), the home page's download buttons and /download/* all read the
# repository's *latest* release. Only an app release (tag v1.2.3, with latest.json) may be it: any
# other release (Bible packs, song packs) is turned into a pre-release here, and the newest app
# release made the latest again. Use scripts/publish-assets.sh to publish packs.
name: Release guard

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - name: Keep the latest release an app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$TAG" =~ ^v[0-9] ]]; then echo "$TAG is an app release."; exit 0; fi
          if [[ "$PRERELEASE" != "true" ]]; then
            echo "::warning::$TAG is not an app release; making it a pre-release so updates keep working."
            gh release edit "$TAG" --prerelease --latest=false
          fi
          app="$(gh api "repos/$GH_REPO/releases?per_page=50" -q '[.[] | select(.draft|not) | select(.prerelease|not) | select(.tag_name|test("^v[0-9]"))][0].tag_name')"
          if [[ -n "$app" ]]; then gh release edit "$app" --latest; echo "$app is the latest release."; fi
