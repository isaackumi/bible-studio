<!doctype html>
<html lang="en" style="background: #050505; color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Church Studio</title>
    <script>
      // After a new version is published, a page kept from before asks for code files that are gone.
      // Load the new version once instead of showing an error (the web version at /app).
      addEventListener("vite:preloadError", (event) => {
        try {
          if (sessionStorage.getItem("cs-reloaded")) return;
          sessionStorage.setItem("cs-reloaded", "1");
        } catch {}
        event.preventDefault();
        location.reload();
      });
      addEventListener("load", () => setTimeout(() => { try { sessionStorage.removeItem("cs-reloaded"); } catch {} }, 5000));
    </script>
    %sveltekit.head%
    <style>
      /* Shown before any script runs, matching the app's loading screen; the app removes it. */
      #preboot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; background: #050505; color: #f5f5f5; font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      #preboot .mark path { animation: preboot-pane 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes preboot-pane { 0%, 100% { opacity: 1; } 35% { opacity: 0.28; } 60% { opacity: 1; } }
      #preboot .bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(245, 245, 245, 0.1); overflow: hidden; }
      #preboot .bar i { display: block; width: 40%; height: 100%; background: #fa4f00; animation: preboot 1.1s ease-in-out infinite; }
      @keyframes preboot { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #preboot .bar i, #preboot .mark path { animation: none; width: 100%; } }
      .no-preboot #preboot { display: none; }
      #slow { position: fixed; inset: 0; z-index: 9999; display: none; place-items: center; padding: 24px; background: #050505; color: #f5f5f5; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #slow.on { display: grid; }
      #slow .card { max-width: 520px; padding: 26px; border: 1px solid #2a2a31; border-radius: 16px; background: #121217; }
      #slow h1 { margin: 0 0 8px; font-size: 19px; }
      #slow p { margin: 0 0 12px; color: #a0a0ab; }
      #slow pre { max-height: 140px; overflow: auto; margin: 0 0 16px; padding: 10px; border-radius: 10px; background: #050505; color: #d8d8de; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
      #slow .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      #slow button { height: 36px; padding: 0 14px; border: 1px solid #2a2a31; border-radius: 10px; background: #18181f; color: #f5f5f5; font: inherit; font-weight: 650; cursor: pointer; }
      #slow button.hot { border: 0; background: #fa4f00; color: #fff; }
    </style>
    <script>
      // Only the operator desk shows the loading mark; audience, stage and phone pages start dark.
      (function () {
        try {
          var meta = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata;
          var label = meta && meta.currentWindow && meta.currentWindow.label;
          if (/[?&](display|stage|remote)=1/.test(location.search) || window.__CHURCH_STUDIO_SURFACE__ === "audience" || (label && label !== "main")) {
            document.documentElement.classList.add("no-preboot");
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" style="margin: 0; background: #050505">
    <div id="preboot" aria-hidden="true"><svg class="mark" viewBox="0 0 256 256" width="76" height="76"><path d="M52 32H108A8 8 0 0 1 116 40V80A8 8 0 0 1 108 88H40A8 8 0 0 1 32 80V52A20 20 0 0 1 52 32Z" fill="#f5f5f5" style="animation-delay:0ms"/><path d="M148 32H204A20 20 0 0 1 224 52V80A8 8 0 0 1 216 88H148A8 8 0 0 1 140 80V40A8 8 0 0 1 148 32Z" fill="#fa4f00" style="animation-delay:420ms"/><path d="M40 112H108A8 8 0 0 1 116 120V216A8 8 0 0 1 108 224H52A20 20 0 0 1 32 204V120A8 8 0 0 1 40 112Z" fill="#f5f5f5" style="animation-delay:140ms"/><path d="M148 112H216A8 8 0 0 1 224 120V204A20 20 0 0 1 204 224H148A8 8 0 0 1 140 216V120A8 8 0 0 1 148 112Z" fill="#f5f5f5" style="animation-delay:280ms"/></svg><span>Church Studio</span><span class="bar"><i></i></span></div>
    <div id="slow" role="alertdialog" aria-labelledby="slow-title"><div class="card"><h1 id="slow-title">Church Studio is taking longer than usual to start</h1><p>It may still finish. If it stays here, send us the details below and we will help.</p><pre id="slow-details"></pre><div class="actions"><button type="button" class="hot" id="slow-mail">Email support with these details</button><button type="button" id="slow-copy">Copy details</button><button type="button" id="slow-reload">Start again</button><button type="button" id="slow-wait">Keep waiting</button></div></div></div>
    <script>
      // If the desk has not started after 25 seconds, say so with what it was doing and any error,
      // instead of a loading mark forever. Plain old JavaScript, so it works on any Mac's browser.
      (function () {
        var errors = [];
        window.addEventListener("error", function (event) { errors.push(String((event && (event.message || (event.error && event.error.message))) || "error")); });
        window.addEventListener("unhandledrejection", function (event) { var r = event && event.reason; errors.push(String((r && r.message) || r || "rejected")); });
        var main = true;
        try {
          var meta = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata;
          var label = meta && meta.currentWindow && meta.currentWindow.label;
          main = !(/[?&](display|stage|remote|second|screen)=/.test(location.search)) && !(label && label !== "main");
        } catch (error) {}
        if (!main) return;
        function details() {
          return [
            "Step: " + (window.__csBootStep || "loading the app"),
            "Errors: " + (errors.length ? errors.slice(-5).join(" | ") : "none"),
            "Browser engine: " + navigator.userAgent,
            "Time: " + new Date().toISOString(),
          ].join("\n");
        }
        function show() {
          if (window.__csBootStep === "ready") return;
          document.getElementById("slow-details").textContent = details();
          document.getElementById("slow").className = "on";
        }
        function open(url) {
          try { if (window.__TAURI_INTERNALS__) { window.__TAURI_INTERNALS__.invoke("plugin:opener|open_url", { url: url }); return; } } catch (error) {}
          window.location.href = url;
        }
        var timer = setTimeout(show, 25000);
        document.addEventListener("click", function (event) {
          var id = event.target && event.target.id;
          if (id === "slow-mail") open("mailto:support@heitechinc.com?subject=" + encodeURIComponent("Church Studio does not start") + "&body=" + encodeURIComponent(details()));
          if (id === "slow-copy") { try { navigator.clipboard.writeText(details()); event.target.textContent = "Copied"; } catch (error) {} }
          if (id === "slow-reload") window.location.reload();
          if (id === "slow-wait") { document.getElementById("slow").className = ""; clearTimeout(timer); timer = setTimeout(show, 25000); }
        });
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
