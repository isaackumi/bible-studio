<!doctype html>
<html lang="en" style="background: #050505; color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Church Studio</title>
    <script>
      // After a new version is published, a page kept from before asks for code files that are gone.
      // Load the new version once instead of showing an error (the web version at /app).
      addEventListener("vite:preloadError", (event) => {
        try {
          if (sessionStorage.getItem("cs-reloaded")) return;
          sessionStorage.setItem("cs-reloaded", "1");
        } catch {}
        event.preventDefault();
        location.reload();
      });
      addEventListener("load", () => setTimeout(() => { try { sessionStorage.removeItem("cs-reloaded"); } catch {} }, 5000));
    </script>
    %sveltekit.head%
    <style>
      /* Shown before any script runs, matching the app's loading screen; the app removes it. */
      #preboot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; background: #050505; color: #f5f5f5; font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      #preboot .mark path { animation: preboot-pane 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes preboot-pane { 0%, 100% { opacity: 1; } 35% { opacity: 0.28; } 60% { opacity: 1; } }
      #preboot .bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(245, 245, 245, 0.1); overflow: hidden; }
      #preboot .bar i { display: block; width: 40%; height: 100%; background: #fa4f00; animation: preboot 1.1s ease-in-out infinite; }
      @keyframes preboot { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #preboot .bar i, #preboot .mark path { animation: none; width: 100%; } }
      .no-preboot #preboot { display: none; }
    </style>
    <script>
      // Only the operator desk shows the loading mark; audience, stage and phone pages start dark.
      (function () {
        try {
          var meta = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata;
          var label = meta && meta.currentWindow && meta.currentWindow.label;
          if (/[?&](display|stage|remote)=1/.test(location.search) || window.__CHURCH_STUDIO_SURFACE__ === "audience" || (label && label !== "main")) {
            document.documentElement.classList.add("no-preboot");
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" style="margin: 0; background: #050505">
    <div id="preboot" aria-hidden="true"><svg class="mark" viewBox="0 0 256 256" width="76" height="76"><path d="M52 32H108A8 8 0 0 1 116 40V80A8 8 0 0 1 108 88H40A8 8 0 0 1 32 80V52A20 20 0 0 1 52 32Z" fill="#f5f5f5" style="animation-delay:0ms"/><path d="M148 32H204A20 20 0 0 1 224 52V80A8 8 0 0 1 216 88H148A8 8 0 0 1 140 80V40A8 8 0 0 1 148 32Z" fill="#fa4f00" style="animation-delay:420ms"/><path d="M40 112H108A8 8 0 0 1 116 120V216A8 8 0 0 1 108 224H52A20 20 0 0 1 32 204V120A8 8 0 0 1 40 112Z" fill="#f5f5f5" style="animation-delay:140ms"/><path d="M148 112H216A8 8 0 0 1 224 120V204A20 20 0 0 1 204 224H148A8 8 0 0 1 140 216V120A8 8 0 0 1 148 112Z" fill="#f5f5f5" style="animation-delay:280ms"/></svg><span>Church Studio</span><span class="bar"><i></i></span></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
