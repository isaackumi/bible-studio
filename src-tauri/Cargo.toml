[package]
name = "church-studio"
version = "0.5.6"
description = "Church Studio"
authors = ["Church Studio"]
edition = "2024"

[lib]
name = "church_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
ureq = "3"
# Licensing: checking the server's signed leases (Ed25519) and hashing the hardware id.
ring = "0.17"
sha2 = "0.10"
# The .churchstudio file (bundle.rs): media stored as is, the library deflated.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
reflink-copy = "0.1"
fs4 = "1"
# Nearby (nearby.rs): finding the other computers on this network and licence, over Bonjour (mDNS).
mdns-sd = "0.21"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSRunLoop"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-speech = { version = "0.3.2", features = ["SFSpeechRecognizer", "block2"] }
# Sound outputs (audio_out.rs): already built for cpal, with the same features.
coreaudio-sys = { version = "0.2", default-features = false, features = ["audio_unit", "core_audio"] }
# Whisper on the Mac's graphics (Metal).
whisper-rs = { version = "0.16", features = ["log_backend", "metal"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

# Noise filter for listening: microphone capture and RNNoise (pure Rust), desktop only.
# Accurate listening: Whisper (whisper.cpp) on the computer; its model downloads only when chosen.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15"
nnnoiseless = { version = "0.5", default-features = false }
whisper-rs = { version = "0.16", features = ["log_backend"] }

# The computer's id (license binding) read straight from the registry: already part of Tauri's build.
[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"
# Sound outputs (audio_out.rs): Windows' own list of them, and choosing the default. Already built
# for Tauri; this only turns on the parts used.
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_Variant", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
