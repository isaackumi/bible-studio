[package]
name = "church-studio"
version = "0.1.0"
description = "Church Studio"
authors = ["Church Studio"]
edition = "2024"

[lib]
name = "church_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSRunLoop"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-speech = { version = "0.3.2", features = ["SFSpeechRecognizer", "block2"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Noise filter for listening: microphone capture and RNNoise (pure Rust), desktop only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15"
nnnoiseless = { version = "0.5", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
